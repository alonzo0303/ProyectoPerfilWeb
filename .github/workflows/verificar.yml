name: Verificar web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- src/main/resources/static/css/site.css src/main/resources/static/vendor
      - run: sh mvnw --batch-mode verify
