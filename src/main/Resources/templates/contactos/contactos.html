<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto & Cotización | Alsha Group</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="body-contacto">

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="nav-brand">
            <a th:href="@{/alsha-inicio}" style="display: flex; align-items: center; gap: 15px; text-decoration: none; color: white;">
                <img th:src="@{/imagenes/LogoAlsha.png}" alt="Alsha Group Logo" class="logo-img">
                <div class="brand-text">
                    <span class="company-name">ALSHA GROUP</span>
                    <span class="tagline">creamos | diseñamos | arreglamos tu página web</span>
                </div>
            </a>
        </div>
        <nav class="nav-links">
            <a th:href="@{/alsha-inicio}">← Volver al Inicio</a>
        </nav>
    </header>

    <!-- SECCIÓN FORMULARIO -->
    <section class="seccion-formulario-contacto">
        <div class="container-form">
            <div class="form-header">
                <h2>Impulsa tu proyecto con Alsha Group 🚀</h2>
                <p>Déjanos tus datos y la información de tu empresa. Un asesor especialista se pondrá en contacto contigo de inmediato.</p>
            </div>

            <form th:action="@{/alsha-inicio}" method="get" class="formulario-registro">
                <div class="form-group-grid">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono / WhatsApp *</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej. +51 987654321" required>
                    </div>
                </div>

                <div class="form-group-grid">
                    <div class="form-group">
                        <label for="email">Correo Electrónico *</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@empresa.com" required>
                    </div>

                    <div class="form-group">
                        <label for="empresa">Nombre de tu Empresa / Marca</label>
                        <input type="text" id="empresa" name="empresa" placeholder="Ej. Calzados Perez S.A.C.">
                    </div>
                </div>

                <div class="form-group">
                    <label for="rubro">¿A qué se dedica tu empresa o negocio?</label>
                    <input type="text" id="rubro" name="rubro" placeholder="Ej. Venta de ropa, Restobar, Servicios de Ingeniería, etc.">
                </div>

                <div class="form-group">
                    <label for="servicio">Servicio de interés *</label>
                    <select id="servicio" name="servicio" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="diseno-web">Diseño y Desarrollo de Página Web</option>
                        <option value="app-web">Desarrollo de Software / App a medida</option>
                        <option value="reparacion-web">Mantenimiento o Arreglo de Web existente</option>
                        <option value="branding">Branding e Identidad de Marca</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensaje">Cuéntanos más sobre tu proyecto o necesidad</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí los detalles principales..."></textarea>
                </div>

                <button type="submit" class="btn-impulsar btn-enviar">Enviar Solicitud 🚀</button>
            </form>
        </div>
    </section>

    <!-- FOOTER SIMPLE -->
    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Alsha Group. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
